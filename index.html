<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cards Interativos - Feed</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>Meu Feed de Publicações</h1>
    <button id="theme-toggle">Alternar Modo Escuro</button>
  </header>

  <main class="container">
    <article class="card">
      <img src="https://picsum.photos/600/300?random=1" alt="Imagem do Post" class="card-image">
      <div class="card-content">
        <h2>Explorando Novas Tecnologias</h2>
        <p>Aprenda como aplicar efeitos interativos com CSS modernizado e respostas dinâmicas de modo escuro.</p>
        <button class="card-btn">Ler Mais</button>
      </div>
    </article>

    <article class="card">
      <img src="https://picsum.photos/600/300?random=2" alt="Imagem do Post" class="card-image">
      <div class="card-content">
        <h2>Design Responsivo e UX</h2>
        <p>Criar interfaces atraentes com sombras e animações melhora significativamente a experiência do usuário.</p>
        <button class="card-btn">Ler Mais</button>
      </div>
    </article>
  </main>

  <script src="script.js"></script>
</body>
</html>
